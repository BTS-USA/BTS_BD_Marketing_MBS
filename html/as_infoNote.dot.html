<section class="identifier-background identifier--display-table" style="background-image:url('{{=it.images[0].src}}')">
    <article class="inc-noteBox-container">
        {{~it.textContent:content:index}}
        {{?content.alignment}}
        <div class="inc-noteBox {{=content.alignment}}">
            {{? content.icon}}
            <div class="inc-noteBox-img {{=content.alignment}}-img" style="background-image:url('{{=content.icon}}')">
            </div>
            {{?}}
            {{? content.title}}
            <div class="inc-noteBox-text {{=content.alignment}}-text">
                <div class="MainBox_Text">{{=content.title}}</div>
                {{? it.menuOptions}}
                <footer class="identifier-footer cl-xs-column-12 cl-md-column-12">
                    <div class="identifier__start-button">
                        {{~it.menuOptions:option:optionIndex }}
                        <div class="cl-button cl-button--submit option-{{=optionIndex}} nc-navigationOptions {{?(!option.navigation.remove)}}active{{?}} {{? option.selected}}nc-button--selected {{?}} {{=option.navigation.targetSection}}" data-remove="{{=option.navigation.remove}}" data-action-option="{{=optionIndex}}" data-navigate="click" {{=option.navigation.data}}>
                            {{? option.img}}
                            <img class="cl-button__image" src="{{=option.img}}" height="20" />
                            {{??}}
                            <span class="cl-button__text">{{=option.navigation.title}}</span>
                            {{?}}
                        </div>
                        {{~}}
                    </div>
                </footer>
                {{?}}
            </div>
            {{?}}
        </div>
        {{?}}
        {{~}}
    </article>
</section>
